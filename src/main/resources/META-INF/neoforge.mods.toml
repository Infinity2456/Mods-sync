[[mods]]
modId="modsync"
version="1.1.0"
displayName="ModSync"
authors="M4lph4s_"
description='''
Автоматическая синхронизация модов. Сервер открывает отдельный TCP-порт и раздаёт моды из своей папки mods;
клиент при запуске игры обращается на адрес из конфига, сравнивает моды, докачивает недостающие и перезапускается.
Должен стоять и на сервере, и на клиенте.
'''

